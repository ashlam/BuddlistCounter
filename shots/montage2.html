<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>净课 · 本轮改动预览</title>
<style>
  body{margin:0;background:#EDE7DC;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:26px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  figure{margin:0;background:#fff;border-radius:16px;padding:10px 10px 6px;box-shadow:0 6px 18px rgba(90,70,40,.12)}
  img{width:100%;display:block;border-radius:10px}
  figcaption{margin-top:8px;font-size:15px;color:#5D5449;text-align:center;letter-spacing:.5px}
</style>
</head>
<body>
<div class="grid">
  <figure><img src="V-gold-light-home.png"><figcaption>素金 · 日间（默认）</figcaption></figure>
  <figure><img src="V-green-light-home.png"><figcaption>墨绿 · 日间</figcaption></figure>
  <figure><img src="V-pink-light-home.png"><figcaption>霞粉 · 日间</figcaption></figure>
  <figure><img src="V-gold-light-sheet.png"><figcaption>主题选择弹层</figcaption></figure>
  <figure><img src="V-gold-dark-home.png"><figcaption>素金 · 夜间</figcaption></figure>
  <figure><img src="V-green-dark-home.png"><figcaption>墨绿 · 夜间（黑绿）</figcaption></figure>
  <figure><img src="V-pink-dark-home.png"><figcaption>霞粉 · 夜间（黑红）</figcaption></figure>
  <figure><img src="V-green-dark-count.png"><figcaption>计数页 · 黑绿</figcaption></figure>
</div>
</body>
</html>
