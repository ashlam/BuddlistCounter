<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-accent="gold">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FAF6EF">
<title>大白牛车 · 读经计数器</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="fakebar" id="fakebar">
      <span class="fb-time">9:41</span>
      <span class="fb-right">
        <svg width="17" height="11" viewBox="0 0 17 11"><path d="M1 8h2v3H1zM5 6h2v5H5zM9 3.5h2V11H9zM13 1h2v10h-2z" fill="currentColor"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.2l2.2-2.6a3.4 3.4 0 00-4.4 0L8 11.2zM8 6.4c1.4 0 2.7.5 3.7 1.4l1.3-1.5A7.7 7.7 0 008 4.4c-1.9 0-3.7.7-5 2l1.3 1.4A5.5 5.5 0 018 6.4zM8 2.4c2.4 0 4.6.9 6.3 2.4L15.6 3.3A10 10 0 008 1C5.8 1 3.7 1.8 2.1 3.3l1.3 1.5A8.4 8.4 0 018 2.4z" fill="currentColor"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="1.6" fill="currentColor"/><path d="M23 4v4a2.4 2.4 0 000-4z" fill="currentColor" opacity=".5"/></svg>
      </span>
    </div>

    <div class="app">
      <!-- ============ 功课 ============ -->
      <section class="pane on" id="pane-home">
        <header class="hd">
          <div class="hd-row">
            <div>
              <div class="hd-title">功课</div>
              <div class="hd-sub" id="homeDate"></div>
            </div>
            <div class="hd-acts">
              <button class="txt-btn" id="btnSort">排序</button>
              <button class="txt-btn" id="btnAdd">添加功课</button>
            </div>
          </div>
        </header>
        <div class="pane-body home-body">
          <div class="list" id="homeList"></div>
          <div class="tip-note" id="homeTip">轻触功课进入计数 · 点「报数」快速录入</div>
        </div>
      </section>

      <!-- ============ 统计 ============ -->
      <section class="pane" id="pane-stats">
        <header class="hd">
          <div class="hd-title">统计</div>
          <div class="hd-sub">记录每一天的精进</div>
        </header>
        <div class="pane-body">
          <div class="chips" id="statsItems"></div>
          <div class="seg" id="statsSeg">
            <button class="seg-i on" data-scope="month">月</button>
            <button class="seg-i" data-scope="year">年</button>
            <button class="seg-i" data-scope="all">总</button>
          </div>
          <div class="period">
            <button class="pv" id="perPrev" aria-label="上一期">
              <svg width="9" height="15" viewBox="0 0 9 15"><path d="M7.5 1L1.5 7.5l6 6.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="per-label" id="perLabel">2026-11</div>
            <button class="pv" id="perNext" aria-label="下一期">
              <svg width="9" height="15" viewBox="0 0 9 15"><path d="M1.5 1l6 6.5-6 6.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="chart-wrap" id="chartWrap"></div>
          <div class="dc" id="statsDetail"></div>
          <div class="stat-row" id="statsRow"></div>
        </div>
      </section>

      <!-- ============ 我的 ============ -->
      <section class="pane" id="pane-me">
        <header class="hd">
          <div class="hd-title">我的</div>
          <div class="hd-sub">数据只存在本机，安心使用</div>
        </header>
        <div class="pane-body">
          <div class="me-hero">
            <div class="me-ring" id="meRing"></div>
            <div class="me-num" id="meTotal">0</div>
            <div class="me-lbl">累计总数</div>
            <div class="me-meta" id="meMeta"></div>
          </div>

          <div class="group">
            <div class="row" id="rowTheme"><span>主题配色</span><span class="row-val" id="themeName">素金 ›</span></div>
            <div class="row" id="rowDark"><span>夜间模式</span><span class="sw" id="swDark"></span></div>
          </div>

          <div class="group">
            <div class="row" id="rowVibrate"><span>点击震动</span><span class="sw" id="swVibrate"></span></div>
            <div class="row" id="rowSound"><span>点击音效</span><span class="sw" id="swSound"></span></div>
          </div>

          <div class="group">
            <div class="row" id="rowExport"><span>导出备份</span><span class="row-arrow">›</span></div>
            <div class="row" id="rowImport"><span>导入备份</span><span class="row-arrow">›</span></div>
            <div class="row" id="rowMerit"><span>回向记录</span><span class="row-val" id="meritCount">0 次 ›</span></div>
          </div>

          <div class="group">
            <div class="row" id="rowAbout"><span>关于大白牛车</span><span class="row-arrow">›</span></div>
          </div>
          <div class="foot-note">一切数据皆为本地存储 · 换机请先导出备份</div>
          <input type="file" id="importFile" accept="application/json,.json" hidden>
        </div>
      </section>

      <!-- ============ 计数页 ============ -->
      <section class="detail" id="detail">
        <header class="dhd">
          <button class="back" id="btnBack" aria-label="返回">
            <svg width="11" height="19" viewBox="0 0 11 19"><path d="M9.5 1.5L2 9.5l7.5 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="dhd-title" id="dTitle">心经</div>
          <span class="dhd-hold"></span>
        </header>

        <div class="count-body">
          <div class="cstats">
            <div class="cs"><div class="cs-n" id="cToday">0</div><div class="cs-l">今日</div></div>
            <div class="cs"><div class="cs-n" id="cTotal">0</div><div class="cs-l">累计</div></div>
            <div class="cs"><div class="cs-n" id="cGoal">未设置</div><div class="cs-l" id="cGoalLbl">目标</div></div>
          </div>

          <div class="tapzone" id="tapzone">
            <div class="emblem" id="emblem" aria-hidden="true"></div>
            <div class="center">
              <div class="center-n" id="centerNum">0</div>
              <div class="center-u" id="centerUnit">遍</div>
            </div>
            <div class="plus-pops" id="pops"></div>
          </div>

          <div class="step-row">
            <button class="undo" id="btnUndo" aria-label="撤销一次">
              <svg width="15" height="15" viewBox="0 0 16 16"><path d="M5.5 3.5L2 6.6l3.5 3.1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.4 6.6h6a4.5 4.5 0 014.5 4.5v1.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
            <div class="steps" id="steps">
              <button class="step on" data-step="1">＋1</button>
              <button class="step" data-step="10">＋10</button>
              <button class="step" data-step="108">＋108</button>
            </div>
            <button class="undo" id="btnReport" aria-label="报数">
              <svg width="16" height="16" viewBox="0 0 18 18"><path d="M3 15.5V9.5M9 15.5V3.5M15 15.5V6.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div class="hint">轻触莲台即可计数 · 长按连续</div>
        </div>

        <div class="dact">
          <button class="da" data-act="goal">
            <svg width="22" height="22" viewBox="0 0 24 24"><path d="M6 21V4.5c3-1.6 6-1.6 9 0s5 1.4 5 1.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M6 4.5V3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span>目标</span>
          </button>
          <button class="da" data-act="merit">
            <svg width="22" height="22" viewBox="0 0 24 24"><path d="M8.6 11.5L12 8.2l3.4 3.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 8.2V3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M4 13c1.6 4 4.4 6 8 6s6.4-2 8-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span>回向</span>
          </button>
          <button class="da" data-act="stats">
            <svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 20h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M6.5 20V12M12 20V5.5M17.5 20v-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span>统计</span>
          </button>
          <button class="da" data-act="setting">
            <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.6v2.6M12 18.8v2.6M2.6 12h2.6M18.8 12h2.6M5.4 5.4l1.8 1.8M16.8 16.8l1.8 1.8M18.6 5.4l-1.8 1.8M7.2 16.8l-1.8 1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span>设置</span>
          </button>
        </div>
      </section>

      <!-- ============ tabbar ============ -->
      <nav class="tabbar" id="tabbar">
        <button class="tab on" data-tab="home">
          <svg width="24" height="24" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 20c-2.4-2.2-3.4-4.6-3.4-6.6C8.6 10.4 10 8.4 12 7.2c2 1.2 3.4 3.2 3.4 6.2 0 2-1 4.4-3.4 6.6z"/><path d="M8.6 20c-2.2-.4-3.6-1.5-4.4-3 1.4-1 2.8-1.2 4-1"/><path d="M15.4 20c2.2-.4 3.6-1.5 4.4-3-1.4-1-2.8-1.2-4-1"/></g></svg>
          <span>功课</span>
        </button>
        <button class="tab" data-tab="stats">
          <svg width="24" height="24" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4.5 19.5h15"/><path d="M7 19.5v-6M12 19.5V6M17 19.5v-4"/></g></svg>
          <span>统计</span>
        </button>
        <button class="tab" data-tab="me">
          <svg width="24" height="24" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8.4" r="3.4"/><path d="M4.8 20c.6-3.6 3.6-5.6 7.2-5.6s6.6 2 7.2 5.6"/></g></svg>
          <span>我的</span>
        </button>
      </nav>

      <div class="sheet-layer" id="sheetLayer">
        <div class="sheet-backdrop" id="sheetBackdrop"></div>
        <div class="sheet" id="sheet"></div>
      </div>
      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
